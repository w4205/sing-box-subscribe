services:
  sing-box-subscribe:
    image: sing-box-subscribe:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sing-box-subscribe
    restart: unless-stopped
    ports:
      - "5000:5000"
    networks:
      - default
      - cloudflare_tunnel
      - homelab_ingress

networks:
  cloudflare_tunnel:
    external: true
  homelab_ingress:
    external: true
